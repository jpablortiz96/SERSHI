[env]
# ts-rs writes the generated TypeScript contracts here (see docs/ARCHITECTURE.md#ipc).
TS_RS_EXPORT_DIR = { value = "packages/contracts/src/generated", relative = true }

# ── whisper.cpp (voice, Windows only; docs/VOICE.md#building) ─────────────
# These are read only by whisper-rs-sys's build script, which forwards
# GGML_* and CMAKE_* variables to CMake.
#
# Portable CPU baseline (AVX2/FMA/F16C) instead of `-march=native`, so a
# binary built on one machine runs on another and CI matches local builds.
GGML_NATIVE = "OFF"
# The `cmake` crate replaces MSVC's per-configuration flags with its own and
# drops the optimisation level, which made recognition ~10x slower (measured:
# 35 s vs 3.3 s for one utterance). Restore /O2 for both configurations the
# build script uses (Release, and RelWithDebInfo in debug builds).
CMAKE_C_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_C_FLAGS_RELWITHDEBINFO = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELWITHDEBINFO = "/MD /O2 /Ob2 /DNDEBUG"
