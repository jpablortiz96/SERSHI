[workspace]
resolver = "3"
members = ["crates/sershi-core", "crates/sershi-platform", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jpablortiz96/SERSHI"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
sershi-core = { path = "crates/sershi-core" }
sershi-platform = { path = "crates/sershi-platform" }

[workspace.lints.rust]
# Only crates/sershi-platform/src/windows (Win32 FFI) may opt out, with #![allow(unsafe_code)].
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
