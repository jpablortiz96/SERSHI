name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  portable:
    name: Portable checks (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Frontend — format, lint, typecheck, test, build
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust — fmt, clippy, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p sershi-core --all-targets --features ts --locked -- -D warnings
          cargo test --workspace --locked

      - name: Contracts are up to date with Rust
        run: |
          pnpm contracts:generate
          if [ -n "$(git status --porcelain -- packages/contracts)" ]; then
            git status --porcelain -- packages/contracts
            echo "::error::Generated contracts differ. Run 'pnpm contracts:generate' and commit the result."
            exit 1
          fi

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    env:
      # whisper.cpp (local speech recognition) is built with CMake (preinstalled)
      # and bound with bindgen, which needs libclang from the preinstalled LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # GPU speech recognition (Vulkan) needs the Vulkan SDK at build time
      # (headers, vulkan-1.lib, glslc). Pinned installer, verified by SHA-256.
      VULKAN_SDK_VERSION: 1.4.357.0
      VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
      VULKAN_SDK: C:\VulkanSDK\1.4.357.0
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}

      - name: Install Vulkan SDK (pinned, verified)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK checksum mismatch: $hash" }
          & $installer --root $env:VULKAN_SDK --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { throw "Vulkan SDK install incomplete" }

      # whisper.cpp builds with the Ninja generator (MSBuild's file tracker
      # fails on the Vulkan backend's nested build paths). Pinned version.
      - name: Tools on PATH (Vulkan SDK, Ninja)
        shell: pwsh
        run: |
          "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          python -m pip install --disable-pip-version-check ninja==1.11.1.4
          ninja --version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Frontend — typecheck, test, build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      # Compiles the Tauri shell (including the cfg(windows) platform module
      # and the Vulkan speech backend) and runs every Rust test. The runner
      # may have no GPU driver: SERSHI delay-loads vulkan-1.dll and falls
      # back to the CPU, which these tests exercise.
      - name: Rust — clippy and test
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # Read-only discovery against the runner's real Windows APIs (nothing is
      # launched or closed); prints the scan time for the validation record.
      - name: Windows application discovery (read-only)
        run: cargo test -p sershi-platform --test windows_applications --locked -- --nocapture

      # Lists microphones, installed voices and the microphone privacy switch
      # (read-only). Tests needing a model, a microphone or speakers are
      # #[ignore]d and run on physical hardware (Gate 3A); CI does not fake them.
      - name: Windows voice adapters (read-only)
        run: cargo test -p sershi-platform --test windows_voice --locked -- --nocapture
