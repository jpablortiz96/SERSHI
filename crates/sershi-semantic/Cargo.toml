[package]
name = "sershi-semantic"
description = "SERSHI's local semantic-model runtime: llama.cpp in a separate process, driven over stdin/stdout. It generates grammar-constrained text and nothing else (docs/SEMANTIC.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sershi-semantic"
path = "src/main.rs"

[features]
default = ["vulkan"]
# GPU inference through Vulkan (NVIDIA, AMD, Intel), CPU otherwise. Needs
# the Vulkan SDK at build time, like speech recognition (docs/VOICE.md).
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

# llama.cpp (Windows only, like whisper.cpp). Its own process, so its ggml
# never meets whisper.cpp's ggml in SERSHI's address space. No OpenMP (no
# extra runtime DLL); llama.cpp's own thread pool is used.
[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_System_LibraryLoader"]

[lints]
workspace = true
