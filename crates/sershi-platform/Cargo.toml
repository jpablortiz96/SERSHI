[package]
name = "sershi-platform"
description = "Operating-system adapters for SERSHI ports. Windows-specific code lives in `src/windows`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sershi-core.workspace = true
sysinfo.workspace = true
# SHA-256 for speech-model integrity (RustCrypto; already built by Tauri).
sha2 = "0.10"

# Voice (Windows only; docs/VOICE.md and ADR 0014):
# - cpal: WASAPI capture/playback. Same `windows` crate version as below.
# - whisper-rs: local whisper.cpp speech recognition, in process. Building
#   it needs CMake and libclang (LLVM); see docs/VOICE.md#building.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
whisper-rs = "0.16"


# Win32 bindings, same version Tauri already links (no duplicate crate).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
